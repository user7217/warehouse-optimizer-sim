# Included in every location (nginx drops server-level add_header once a location adds its own).
#
# COOP + COEP make the page cross-origin isolated. That enables SharedArrayBuffer, which the
# Stop button uses to interrupt a runaway Python loop, and gives ~5 us timer precision instead
# of ~100 us for the algorithm timings. Everything is same-origin, so require-corp costs nothing.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# CSP: only our own files. 'wasm-unsafe-eval' lets the browser compile Pyodide's WebAssembly.
# Python the user types runs inside that WebAssembly sandbox, in a worker, never as page JS.
# 'unsafe-inline' for styles only: the editor and 3D libraries inject <style> tags.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
