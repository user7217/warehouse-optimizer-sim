# Static file server for the warehouse testbed. No application code runs on the server:
# the simulator and users' algorithms run in the visitor's browser (Pyodide + Web Worker).
#
# Runs as an unprivileged user (nginx-unprivileged image, uid 101), on port 8080,
# with a read-only root filesystem: everything writable lives in /tmp (tmpfs).

worker_processes 1;            # one core is plenty for static files; keeps CPU/RAM tiny
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include       /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log off;            # nothing is stored; Cloudflare has request analytics if you need them
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;
    client_max_body_size 1k;   # nothing is ever uploaded
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/wasm image/svg+xml application/zip;

    server {
        listen 8080;
        listen [::]:8080;
        root /usr/share/nginx/html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Vite's content-hashed bundles: cache forever.
        location /assets/ {
            limit_except GET HEAD { deny all; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Python runtime (~10-15 MB). Versioned by the image; cache for a week.
        location /pyodide/ {
            limit_except GET HEAD { deny all; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            try_files $uri =404;
        }

        location / {
            limit_except GET HEAD { deny all; }
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
